<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Review MacroPlate meal plans, healthy add-ons, and meal prep services.">
    <meta name="author" content="Parker Wright">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
    <script src="scripts/getdates.js" defer></script>
</head>
<body>
    <body>
        <header>
            <h1>MacroPlate Product Review</h1>
        </header>
    
        <form method="get" action="review.html">
        <label for="product">MacroPlate Product:</label>
        <select id="product" name="product" required>
            <option value="" disabled selected>Select a Product ...</option>
        </select>

        <fieldset>
            <legend>Overall Rating:</legend>
            <div class="star-rating">
            <input type="radio" name="stars" id="star-a" value="5" aria-label="5 stars" required/>
            <label for="star-a"></label>

            <input type="radio" name="stars" id="star-b" value="4" aria-label="4 stars" required/>
            <label for="star-b"></label>

            <input type="radio" name="stars" id="star-c" value="3" aria-label="3 stars" required/>
            <label for="star-c"></label>

            <input type="radio" name="stars" id="star-d" value="2" aria-label="2 stars" required/>
            <label for="star-d"></label>

            <input type="radio" name="stars" id="star-e" value="1" aria-label="1 star" required/>
            <label for="star-e"></label>
            </div>
        </fieldset>


        <label for="installation">Date of First Delivery:</label>
        <input type="date" id="installation" name="installation" required>

        <fieldset>
            <legend>Useful Features and Services (check all that apply):</legend>
            <input type="checkbox" id="feature1" name="features" value="customized-meals">
            <label for="feature1">Meals customized for my calorie goals</label>
            <input type="checkbox" id="feature2" name="features" value="macro-balanced-meals">
            <label for="feature2">Macro-balanced, high-protein meal options</label>
            <input type="checkbox" id="feature3" name="features" value="nutrition-coaching">
            <label for="feature3">One-on-one nutrition coaching</label>
            <input type="checkbox" id="feature4" name="features" value="local-delivery">
            <label for="feature4">Fresh meals delivered locally</label>
            <input type="checkbox" id="feature5" name="features" value="heat-and-eat">
            <label for="feature5">Convenient heat-and-eat preparation</label>
        </fieldset>

        <label for="review">Written Review: (optional)</label>
        <textarea id="review" name="review"></textarea>

        <label for="username">User Name: (optional)</label>
        <input type="text" id="username" name="username">

        <input type="submit" value="Submit Review">
    </form>
<footer>
    <p>&copy; <span id="currentyear"></span> Parker Wright | Utah, USA</p>
    <p id="lastModified"></p>
</footer>
</body>
</html>
