<!-- This assignment applies the concepts presented in the learning activities to a picture album page that is responsive in
both small and larger views. This page will use a 'hamburger' menu and respond to user interaction.

Associated Course Learning Outcomes
Develop responsive web pages that follow best practices and use valid HTML and CSS.
Demonstrate proficiency with JavaScript language syntax.
Use JavaScript to respond to events and dynamically modify HTML.

Task
Design, develop, test, and deploy a temple album page using your own selection of temple pictures.
-->
